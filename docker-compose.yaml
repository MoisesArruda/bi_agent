# podman-compose build 
version: '3.8'

services:

  frontend:
    build: .

    ports:
      - "8501:8501"
    environment:
    #   REDIS_HOST: redis
    #   REDIS_PORT: 6379
    #   # Configurações do PostgreSQL
    #   POSTGRES_HOST: postgres
    #   POSTGRES_PORT: 5432
    #   POSTGRES_DB: bi_agent_db
    #   POSTGRES_USER: postgres
    #   POSTGRES_PASSWORD: postgres123
    # # Garante que o backend só inicie após o Redis e PostgreSQL
    # depends_on:
    #   - redis
    #   - postgres


  redis:

    image: "redis:latest"

    ports:
      - "6379:6379"

    volumes:
      - redis-data:/data


  postgres:

    image: "postgres:15"

    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: bi_agent_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    volumes:
      - postgres-data:/var/lib/postgresql/data
    command: postgres -c log_statement=all

volumes:
  redis-data:
  postgres-data: